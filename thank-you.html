<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Mortgage Minds</title>

    <link rel="icon" href="assets/img/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .thank-you-box {
            max-width: 650px;
            width: 100%;
            background: #fff;
            padding: 50px 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #28a745;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
            font-size: 36px;
        }

        p {
            color: #666;
            line-height: 1.7;
            font-size: 17px;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 16px;
            transition: .3s;
        }

        .btn:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>

    <div class="thank-you-box">
        <div class="icon">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your enquiry has been submitted successfully.
        </p>

        <p>
            One of our mortgage specialists will review your request and contact you as soon as possible.
        </p>

        <a href="/" class="btn">
            Return to Home
        </a>
    </div>

</body>

</html>
